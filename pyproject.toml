[project]
name = "shepard-engine"
version = "0.1.0"
description = "Isolated Binance market pipeline and identity reference implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "celery[redis]>=5.5,<6",
  "redis>=5,<7", "psycopg[binary]>=3.2,<4", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26", "httpx>=0.28,<1", "websockets>=15,<17",
  "pydantic-settings>=2.8,<3", "email-validator>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "fakeredis[lua]>=2.28,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shepard_engine --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
markers = ["integration: requires local Redis and PostgreSQL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/shepard_engine"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "shepard_engine/sql"

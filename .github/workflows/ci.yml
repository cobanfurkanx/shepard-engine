name: Engine CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: engine
          POSTGRES_DB: engine_test
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U engine -d engine_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      RUN_INTEGRATION: '1'
      TEST_DATABASE_URL: postgresql://engine:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/engine_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: docker build -t shepard-engine:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-coverage
          path: coverage.xml
          if-no-files-found: ignore
